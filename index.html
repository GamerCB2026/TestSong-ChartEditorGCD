<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Test Song · Chart Editor GCD</title>
<link rel="stylesheet" href="css/estilo.css?v=3.0.2">
<link rel="stylesheet" href="css/stages.css?v=3.0.2">
<link rel="stylesheet" href="css/personajes.css?v=3.0.2">
<link rel="stylesheet" href="css/notes.css?v=3.0.2">
</head>
<body>
<canvas id="game"></canvas>

<button id="pauseBtn" title="Pausa (Esc / Enter)" aria-label="Pausa"><i></i><i></i></button>

<div id="overlay" role="dialog" aria-modal="true">
  <h2 id="ovTitle" hidden><canvas id="ovTitleCanvas"></canvas><span id="ovTitleText">PAUSA</span></h2>
  <div id="pauseMeta"></div>
  <div id="pauseItems"></div>
  <div id="pausePanel">
    <div id="panelOpts" hidden>
      <h3>⚙ Opciones del chart</h3>
      <div class="row"><label for="modeSel">Modo</label>
        <select id="modeSel">
          <option value="demo">Demo automática</option>
          <option value="keyboard">Teclado (PC)</option>
          <option value="mobile">Táctil (celular)</option>
          <option value="botplay">Botplay perfecto</option>
        </select></div>
      <div class="row" id="diffRow" style="display:none"><label for="diffSel">Dificultad</label><select id="diffSel"></select></div>
      <button class="btn" id="btnLoad">📂 Cargar chart (.fnfc / .json + audio)</button>
      <button class="btn alt" id="btnDemo">🎵 Volver a la canción demo</button>
      <input type="file" id="fileInput" multiple accept=".fnfc,.zip,.json,.ogg,.mp3,.wav">
      <p class="hint">Teclado: <kbd class="l">←</kbd><kbd class="d">↓</kbd><kbd class="u">↑</kbd><kbd class="r">→</kbd> o <kbd>A</kbd><kbd>S</kbd><kbd>W</kbd><kbd>D</kbd> · Pausa: <kbd>Esc</kbd>/<kbd>Enter</kbd> · Menú: <kbd>↑</kbd><kbd>↓</kbd> + <kbd>Enter</kbd><br>
      Táctil: toca las 4 columnas de la pantalla. Acepta .fnfc de V-Slice (chart + metadata + Inst/Voices) o JSON de Psych/legacy.</p>
    </div>
    <div id="panelAssets" hidden>
      <h3>🖼 Assets cargados</h3>
      <div id="assetList" class="hint"></div>
    </div>
  </div>
</div>

<div id="toast"></div>

<!-- Orden de carga: comparten el ámbito global (scripts clásicos, sin módulos: funciona en GitHub Pages) -->
<script src="js/config.js?v=3.0.2"></script>
<script src="js/assets.js?v=3.0.2"></script>
<script src="js/atlas.js?v=3.0.2"></script>
<script src="js/charts.js?v=3.0.2"></script>
<script src="js/audio.js?v=3.0.2"></script>
<script src="js/fuentes.js?v=3.0.2"></script>
<script src="js/personajes.js?v=3.0.2"></script>
<script src="js/stages.js?v=3.0.2"></script>
<script src="js/notes.js?v=3.0.2"></script>
<script src="js/hud.js?v=3.0.2"></script>
<script src="js/ui.js?v=3.0.2"></script>
<script src="js/game.js?v=3.0.2"></script>
</body>
</html>
